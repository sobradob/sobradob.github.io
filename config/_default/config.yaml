baseURL: https://boazsobrado.com/
title: Boaz Sobrado's Website

# Site theme lives in themes/tufte (Eureka was replaced in October 2026)
theme: tufte

pagination:
  pagerSize: 10  # Instead of the old 'paginate: 10'
copyright: >
  &copy; 2026 <a href="https://www.boazsobrado.com/">Boaz Sobrado</a>
enableEmoji: true
enableGitInfo: false
summaryLength: 75

defaultContentLanguage: en
hasCJKLanguage: false # Set `true` for Chinese/Japanese/Korean.
defaultContentLanguageInSubdir: false

markup:
  # Do not modify markup.highlight
  highlight:
    codeFences: false
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true

related:
  includeNewer: true
  threshold: 60
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: series
      weight: 80
    - name: categories
      weight: 50
    - name: date
      weight: 10
taxonomies:
  category: categories
  tag: tags
  series: series
  author: authors

build:
  useResourceCacheWhen: fallback

# Output formats for llms.txt support
outputFormats:
  MD:
    mediaType: text/markdown
    baseName: index
    isPlainText: true
    notAlternative: true
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home: ["HTML", "RSS", "LLMS"]
  page: ["HTML", "MD"]
  section: ["HTML", "RSS"]

permalinks:
  blog: /blog/:year/:month/:day/:title/

params:
  icon: "/sobrado_icon.png"

# Add these lines at the top level of your config.yaml
services:
  googleAnalytics:
    ID: ""  # empty string to disable
  analytics:
    google:
      disable: true
