<!doctype html>
<html lang="{{ .Params.lang | default site.LanguageCode | default "en" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}home{{ else }}{{ .Kind }}{{ end }}">
  <div class="page">
    {{ partial "masthead.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  {{ partial "scripts.html" . }}
</body>
</html>
