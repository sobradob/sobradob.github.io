{{- /* Usage: {{< marginnote >}}An unnumbered note.{{< /marginnote >}} */ -}}
{{- $id := printf "mn-%s-%d" (.Page.File.ContentBaseName | default "page" | urlize) .Ordinal -}}
<label for="{{ $id }}" class="margin-toggle">&#8853;</label><input type="checkbox" id="{{ $id }}" class="margin-toggle"><span class="marginnote">{{ .Inner | .Page.RenderString }}</span>
